  <rect x="8" y="12" width="10" height="1.5" rx="0.75" fill="#22d3ee" opacity="0.7"/>
  <rect x="8" y="14.5" width="7" height="1.5" rx="0.75" fill="#3b82f6" opacity="0.5"/>
